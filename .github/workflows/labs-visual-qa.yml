name: Original Labs · Chromium visual QA

on:
  push:
    branches: [master]
    paths:
      - "scripts/verify-labs.py"
      - "public/labs/original/**"
      - ".github/workflows/labs-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: labs-visual-qa-master
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.58.0" "Pillow>=11,<13"
          python -m playwright install --with-deps chromium
      - name: Capture original interfaces and document failures
        run: python scripts/verify-labs.py
      - name: Upload visual proof regardless of interactive failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-labs-chromium-qa
          path: |
            public/labs/covers/*.webp
            public/labs/qa-report.json
          if-no-files-found: warn
      - name: Publish verified browser captures and QA manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/labs/covers/*.webp public/labs/qa-report.json
          if git diff --staged --quiet; then
            echo "No QA artifact changes to publish"
            exit 0
          fi
          git commit -m "assets(labs): capture real Chromium previews and QA manifest"
          # Source commits may land on master while Chromium is rendering.
          # Rebase the generated-artifact commit rather than force-pushing or
          # dropping source changes from another author.
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              echo "Browser QA artifacts published"
              exit 0
            fi
            echo "Master advanced during capture; rebasing (attempt ${attempt}/3)"
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "::error::QA artifact publish conflict. Download the run artifact; source changes were not overwritten."
              exit 1
            fi
            sleep "$((attempt * 2))"
          done
          echo "::error::Could not publish QA artifacts after three attempts. Run artifact remains available."
          exit 1

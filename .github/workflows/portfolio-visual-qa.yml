name: Portfolio UIUX · local Chromium gates

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "components/**"
      - "lib/portfolio-graph.ts"
      - "scripts/verify-portfolio-ui.py"
      - ".github/workflows/portfolio-visual-qa.yml"

permissions:
  contents: read

concurrency:
  group: portfolio-visual-qa-master
  cancel-in-progress: true

jobs:
  responsive-ui:
    name: Desktop, tablet, mobile and interactive evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate native Anatomy and build Next.js
        run: pnpm build
      - name: Install Chromium test dependencies
        run: |
          python -m pip install "playwright==1.58.0"
          python -m playwright install --with-deps chromium
      - name: Boot local production server
        run: |
          (pnpm start > /tmp/portfolio-next.log 2>&1 & echo $! > /tmp/portfolio-next.pid)
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "Local Next.js production server ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-next.log
          exit 1
      - name: Check responsive UI, links and Anatomy with real Chromium
        run: python scripts/verify-portfolio-ui.py
      - name: Upload screenshots and machine-readable findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-responsive-qa
          path: artifacts/portfolio-ui-qa/
          if-no-files-found: warn

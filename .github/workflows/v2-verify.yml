name: V2 portfolio verification
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.12.1 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: V2 disclosure check
        run: node scripts/v2-validation.mjs
      - name: TypeScript
        run: pnpm typecheck
      - name: Build
        run: pnpm build
